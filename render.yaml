# Render Blueprint for the Pravaha Art Space CRM.
#
# Use either:
#   Render Dashboard -> New -> Blueprint -> pick this repo (branch: master)
# or create the service manually with the same settings.
#
# Secrets are deliberately NOT stored here. DATABASE_URL is marked `sync: false`,
# so Render prompts for it once when the service is created.

services:
  - type: web
    name: pravaha-crm
    runtime: docker
    plan: free
    region: singapore # closest Render region to India; change to oregon/frankfurt if needed
    branch: master
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Required. Paste the Supabase pooler URL from server/.env
      - key: DATABASE_URL
        sync: false

      # Required on HTTPS, otherwise the session cookie is not marked Secure.
      - key: COOKIE_SECURE
        value: "true"

      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: PORT
        value: "10000"

      # Public URL used to build parent-facing receipt links.
      - key: APP_URL
        value: "https://pravaha-crm.onrender.com"

      # WhatsApp (Meta Cloud API). Secrets are entered once in the Render dashboard.
      # While the phone number ID/token are absent the server stays in dry-run automatically.
      - key: WHATSAPP_DRY_RUN
        value: "false"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_FROM_PHONE
        value: "+1 555-167-8247"
      - key: WHATSAPP_TEMPLATE_NAME
        value: "payment_reminder"
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: "en"
      - key: WHATSAPP_RECEIPT_TEMPLATE_NAME
        value: "payment_receipt"
      - key: WHATSAPP_RECEIPT_SHARE_BASE
        value: "https://pravaha-crm.onrender.com"

      # Razorpay (test keys for now; replace with rzp_live_* when KYC is complete).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # Public business website used for Razorpay website verification. It is a plain static site:
  # no server, no database, no secrets. See site/README.md.
  - type: web
    name: pravaha-art-space
    runtime: static
    branch: master
    buildCommand: echo "static site - no build step"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
