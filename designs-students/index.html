<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Students — gradient designs</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px; background: #f7f4fa; color: #2f2a36; font-family: Inter, Arial, sans-serif; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p.muted { color: #8b8590; margin: 0 0 28px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 24px; }
  .frame { background: #fff; border: 1px solid #e4dfec; border-radius: 16px; padding: 14px; }
  .frame > .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #8b8590; margin: 4px 6px 12px; }
  iframe { width: 100%; height: 300px; border: none; border-radius: 12px; background: #f7f4fa; }
</style>
</head>
<body>
  <h1>Students — stat card gradient designs</h1>
  <p class="muted">Sample data · Total 32 · Active 27 · Inactive 5 · Outstanding ₹2,150 (6 students).</p>
  <div class="grid">
    <div class="frame"><div class="label">1 · Uniform tile row</div><iframe src="students-1.html"></iframe></div>
    <div class="frame"><div class="label">2 · Leader + stacked</div><iframe src="students-2.html"></iframe></div>
    <div class="frame"><div class="label">3 · Gradient strip</div><iframe src="students-3.html"></iframe></div>
    <div class="frame"><div class="label">4 · Accent chips</div><iframe src="students-4.html"></iframe></div>
  </div>
  <p class="muted" style="margin-top:24px">Links: <a href="students-1.html">1</a> · <a href="students-2.html">2</a> · <a href="students-3.html">3</a> · <a href="students-4.html">4</a></p>
</body>
</html>
