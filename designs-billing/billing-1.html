<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1 · 2+2</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px; background: #f7f4fa; color: #2f2a36; font-family: Inter, Arial, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .tile { border-radius: 16px; padding: 16px 20px; color: #fff; position: relative; overflow: hidden; box-shadow: 0 8px 20px rgba(80,70,90,.14); }
  .tile .deco { position: absolute; right: -22px; top: -22px; width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .t-get { background: linear-gradient(135deg, #7a5ba8, #9a7cc4); }
  .t-out { background: linear-gradient(135deg, #d96a5a, #b94444); }
  .tile .l { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; opacity: .85; }
  .tile .v { font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-top: 10px; }
  .tile .v .cur { font-size: .72em; font-weight: 600; opacity: .8; }
  .tile .s { font-size: 12px; opacity: .82; margin-top: 6px; }
  .card { background: #fffdf8; border: 1px solid #e4dfec; border-radius: 16px; padding: 16px 18px; box-shadow: 0 6px 18px rgba(80,70,90,.08); }
  .card .h { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #8b8590; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .m { display: grid; grid-template-columns: 84px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
  .m .chip { font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-align: center; }
  .m .bar { height: 8px; border-radius: 99px; background: #ece9f0; overflow: hidden; }
  .m .bar i { display: block; height: 100%; border-radius: 99px; }
  .m .amt { text-align: right; font-weight: 700; font-size: 12.5px; }
  .m .amt small { display: block; font-size: 10px; color: #8b8590; font-weight: 600; }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile t-get"><div class="deco"></div><div class="l">Collected · Sept 2026</div><div class="v"><span class="cur">₹</span>7,980</div><div class="s">14 transactions</div></div>
    <div class="tile t-out"><div class="deco"></div><div class="l">Outstanding dues · Sept 2026</div><div class="v"><span class="cur">₹</span>2,150</div><div class="s">6 students</div></div>
  </div>
  <div class="grid" style="margin-top:14px">
    <div class="card">
      <div class="h">Method split</div>
      <div class="row">
        <div class="m"><span class="chip" style="background:#e4f2ec;color:#2f8f6b">UPI</span><div class="bar"><i style="width:61%;background:#2f8f6b"></i></div><span class="amt">₹4,850<small>8 payments</small></span></div>
        <div class="m"><span class="chip" style="background:#ede6f5;color:#7a5ba8">Cash</span><div class="bar"><i style="width:27%;background:#7a5ba8"></i></div><span class="amt">₹2,130<small>4 payments</small></span></div>
        <div class="m"><span class="chip" style="background:#f6ead6;color:#b0893f">Card</span><div class="bar"><i style="width:13%;background:#b0893f"></i></div><span class="amt">₹1,000<small>2 payments</small></span></div>
      </div>
    </div>
    <div class="card">
      <div class="h">Fee split</div>
      <div class="row">
        <div class="m"><span class="chip" style="background:#ede6f5;color:#7a5ba8">Course</span><div class="bar"><i style="width:82%;background:#7a5ba8"></i></div><span class="amt">₹6,580</span></div>
        <div class="m"><span class="chip" style="background:#f6ead6;color:#b0893f">One-time</span><div class="bar"><i style="width:18%;background:#b0893f"></i></div><span class="amt">₹1,400</span></div>
      </div>
    </div>
  </div>
</body>
</html>
