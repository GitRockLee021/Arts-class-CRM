<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3 · Hero + split cards</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px; background: #f7f4fa; color: #2f2a36; font-family: Inter, Arial, sans-serif; }
  .top { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .top { grid-template-columns: 1fr; } }
  .hero { border-radius: 20px; padding: 24px 26px; position: relative; overflow: hidden; color: #fff; box-shadow: 0 12px 30px rgba(80,70,90,.2); background: linear-gradient(135deg, #241f31, #6b4fa0); }
  .hero .deco { position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.09); }
  .hero .l { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; opacity: .82; }
  .hero .v { font-size: 46px; font-weight: 800; letter-spacing: -2px; margin-top: 8px; }
  .hero .v .cur { font-size: .7em; font-weight: 600; opacity: .75; }
  .prog { margin-top: 20px; }
  .prog .t { display: flex; justify-content: space-between; font-size: 11.5px; opacity: .82; margin-bottom: 7px; }
  .bar { height: 9px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 79%; border-radius: 99px; background: linear-gradient(90deg, #9a7cc4, #e0d3f5); }
  .out { border-radius: 20px; padding: 20px 22px; position: relative; overflow: hidden; color: #fff; box-shadow: 0 12px 30px rgba(80,70,90,.18); display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(135deg, #d96a5a, #b94444); }
  .out .deco { position: absolute; right: -24px; bottom: -30px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.13); }
  .out .l { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; opacity: .85; }
  .out .v { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; margin-top: 10px; }
  .out .v .cur { font-size: .72em; font-weight: 600; opacity: .8; }
  .out .s { font-size: 12.5px; opacity: .85; margin-top: 10px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
  .card { background: #fffdf8; border: 1px solid #e4dfec; border-radius: 16px; padding: 16px 18px; box-shadow: 0 6px 18px rgba(80,70,90,.08); }
  .card .h { font-size: 10.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #8b8590; margin-bottom: 12px; }
  .m { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 12px; }
  .m .chip { font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-align: center; }
  .m .bar { height: 8px; border-radius: 99px; background: #ece9f0; overflow: hidden; }
  .m .bar i { display: block; height: 100%; border-radius: 99px; }
  .m .amt { font-weight: 700; font-size: 12px; }
  .m .amt small { display: block; font-size: 10px; color: #8b8590; }
</style>
</head>
<body>
  <div class="top">
    <div class="hero">
      <div class="deco"></div>
      <div class="l">Collected · September 2026</div>
      <div class="v"><span class="cur">₹</span>7,980</div>
      <div class="prog">
        <div class="t"><span>14 transactions this month</span><span>79% of ₹10,130 expected</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div class="out">
      <div class="deco"></div>
      <div class="l">Outstanding dues</div>
      <div>
        <div class="v"><span class="cur">₹</span>2,150</div>
        <div class="s">6 students yet to pay — reminders ready</div>
      </div>
    </div>
  </div>
  <div class="split">
    <div class="card">
      <div class="h">Method split</div>
      <div class="m"><span class="chip" style="background:#e4f2ec;color:#2f8f6b">UPI</span><div class="bar"><i style="width:61%;background:#2f8f6b"></i></div><span class="amt">₹4,850<small>8 payments</small></span></div>
      <div class="m"><span class="chip" style="background:#ede6f5;color:#7a5ba8">Cash</span><div class="bar"><i style="width:27%;background:#7a5ba8"></i></div><span class="amt">₹2,130<small>4 payments</small></span></div>
      <div class="m"><span class="chip" style="background:#f6ead6;color:#b0893f">Card</span><div class="bar"><i style="width:13%;background:#b0893f"></i></div><span class="amt">₹1,000<small>2 payments</small></span></div>
    </div>
    <div class="card">
      <div class="h">Fee split</div>
      <div class="m"><span class="chip" style="background:#ede6f5;color:#7a5ba8">Course</span><div class="bar"><i style="width:82%;background:#7a5ba8"></i></div><span class="amt">₹6,580</span></div>
      <div class="m"><span class="chip" style="background:#f6ead6;color:#b0893f">One-time</span><div class="bar"><i style="width:18%;background:#b0893f"></i></div><span class="amt">₹1,400</span></div>
    </div>
  </div>
</body>
</html>
